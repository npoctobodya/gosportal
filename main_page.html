<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная страница</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: white;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to bottom, #222222, #4F3A75);
            padding: 30px 20px;
        }

        .navbar .burger {
            cursor: pointer;
            color: white;
            font-size: 24px;
        }

        .navbar .search-container { 
            display: flex;
            align-items: center;
            position: relative;
            flex-direction: row-reverse;
        }

        .searchbutton:hover + .searchinput {
            visibility: block;
            opacity: 1;
            transition: opacity 0.3s ease;
            pointer-events: auto;
        }

        .searchinput:hover {
            visibility: block;
            opacity: 1;
            transition: opacity 0.3s ease;
            pointer-events: auto;
        }

        .searchinput {
            padding: 5px;
            visibility: none; 
            opacity: 0; 
            transition: visibility 0.3s, opacity 0.3s ease;
            pointer-events: none;
        }
        
        ::placeholder{
            color: #ffffff95;
        }
        
        .searchinput input{
            color: white;
            background-color: #ffffff20;
            border: none;
            height: 25px;
        }

        .burger:hover + .account_menu {
            visibility: block;
            opacity: 1;
            transition: opacity 0.3s ease;
            pointer-events: auto;
        }
        
        .account_menu:hover {
            visibility: block;
            opacity: 1;
            transition: opacity 0.3s ease;
            pointer-events: auto;
        }

        .account_menu {
            visibility: none;
            opacity: 0; 
            transition: visibility 0.3s, opacity 0.3s ease;
            pointer-events: none;
        }
        
         .account_menu button{
            background-color: white;
            color: black;
            margin: 5px 5px
        }

        .navbar button {
            padding: 5px 10px;
            margin-left: 5px;
            border: none;
            border-radius: 4px;
            background-color: white;
            color: black;
            cursor: pointer;
        }

        .navbar button:hover {
            background-color: #777;
        }
        .content {
            padding: 20px;
        }
        
        .content button {
            border: none;
            color: white;
            cursor: pointer;
        }
        
        .buttons button:hover{
            
            transform: scale(0.8); 
        }
        
        .buttons {
            display: flex; justify-content: space-evenly; padding: 50px 0px 10px;
        }
        
        .container {
            display: flex; /* Используем Flexbox для расположения элементов в ряд */
            gap: 10px; /* Отступ между элементами */
            justify-content: center; /* Центрируем элементы по горизонтали */
            flex-wrap: wrap; /* Позволяем элементам переноситься на следующую строку, если не хватает места */
        }
        .item {
            border-radius: 10px;
            color: white;
            width: 150px;
            height: 150px;
            background-color: #8A75B0;
            display: flex; /* Используем Flexbox для центрирования содержимого */
            flex-direction: column; /* Располагаем содержимое по вертикали */
            align-items: center; /* Центрируем по горизонтали */
            justify-content: center; /* Центрируем по вертикали */
        }
        
        .item:hover{
          
           border: solid 2px #4F3A75;
           cursor: pointer;
        }
        
    </style>
</head>
